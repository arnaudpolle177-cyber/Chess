name: Build Coach d'échecs (Windows .exe)

# Se déclenche :
# - automatiquement quand tu pousses un tag de version (ex: v1.0, V1.LCO,
#   V2LCO... -- les 2 motifs "v*"/"V*" sont nécessaires car les tags sur
#   push sont sensibles à la casse : sans "V*", tout tag commençant par une
#   majuscule (le style utilisé jusqu'ici pour les releases "VxLCO") ne
#   déclenchait JAMAIS le build automatiquement -- seul le bouton manuel
#   ci-dessous fonctionnait pour ces tags-là, découvert en pratique.
# - à la main depuis l'onglet "Actions" de GitHub (bouton "Run workflow")
on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch: {}

permissions:
  contents: write   # nécessaire pour publier une Release avec le zip

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler CoachEchecs.exe
        run: pyinstaller coach.spec

      - name: Télécharger Berserk (dernière version Windows, renommé en stockfish.exe)
        shell: bash
        # Le moteur "principal" (profils popular/creative, voir web_bridge.py)
        # est Berserk, pas Stockfish -- le code interne (stockfish_path,
        # resolve_stockfish_path, etc.) reste nommé d'après Stockfish pour
        # rester compatible avec n'importe quel moteur UCI (voir
        # engine_analysis.ChessCoachEngine, wrapper générique), mais le
        # binaire réellement embarqué dans le package est Berserk, renommé
        # stockfish.exe pour correspondre à ce que le code attend par défaut.
        # Build "avx2" (sans "-pext") : compatible avec la quasi-totalité des
        # CPU récents, même choix de compromis compatibilité/vitesse que
        # l'ancien téléchargement Stockfish qu'on remplace ici.
        run: |
          set -e
          api_url="https://api.github.com/repos/jhonnold/berserk/releases/latest"
          asset_url=$(curl -s "$api_url" \
            | grep "browser_download_url.*berserk-.*-avx2.exe\"" \
            | head -n1 \
            | cut -d '"' -f4)
          echo "Téléchargement: $asset_url"
          curl -L -o dist/stockfish.exe "$asset_url"

      - name: Préparer le package final
        shell: bash
        run: |
          set -e
          mkdir -p package/CoachEchecs
          cp dist/CoachEchecs.exe package/CoachEchecs/
          cp dist/stockfish.exe package/CoachEchecs/
          # Version embarquée (voir version.py / update_checker.py) : le TAG
          # GIT exact de cette release (ex: "V2LCO"), pour que le coach
          # compilé puisse se comparer à la dernière Release GitHub au
          # démarrage et prévenir l'utilisateur d'une mise à jour
          # disponible. github.ref_name est le nom du tag pour un
          # déclenchement par tag (push tags: v*) ; pour un lancement manuel
          # (workflow_dispatch, pas de vrai tag) c'est le nom de la branche
          # choisie -- suffisant pour un build de test, pas une vraie
          # version publiée.
          echo -n "${{ github.ref_name }}" > package/CoachEchecs/version.txt
          cp README_UTILISATEUR.md package/CoachEchecs/LISEZ-MOI.md
          # Base ECO locale (noms d'ouverture + pros_cons, voir
          # opening_identity.py) : committée au repo, donc copiée SANS
          # condition -- contrairement à opening_book.bin ci-dessous qui est
          # optionnel/fourni par l'utilisateur. Oubliée une 1re fois (bug
          # constaté : l'exe compilé n'affichait jamais les noms d'ouverture,
          # alors qu'une exécution locale via `python main.py` fonctionnait
          # -- app_paths.get_base_dir() cherchait le fichier à côté de
          # l'exe, où il n'avait jamais été copié).
          cp eco_openings.json package/CoachEchecs/
          # Livre(s) d'ouvertures : optionnels. Tout fichier
          # "opening_book*.bin" présent à la racine du dépôt (voir
          # opening_book.py) est embarqué à côté de l'exe -- sinon le coach
          # fonctionne quand même, juste sans lui/eux.
          shopt -s nullglob
          books=(opening_book*.bin)
          if [ ${#books[@]} -gt 0 ]; then
            cp opening_book*.bin package/CoachEchecs/
            echo "Livre(s) d'ouvertures inclus dans le package : ${books[*]}"
          else
            echo "Pas de opening_book*.bin trouvé à la racine du dépôt -- package sans livre d'ouvertures."
          fi
          # Token Lichess (voir lichess_explorer.py) : vient d'un SECRET
          # GitHub Actions, jamais du dépôt lui-même -- il ne doit JAMAIS
          # être commité en clair (historique Git permanent). Configure-le
          # une fois dans Settings > Secrets and variables > Actions >
          # New repository secret, nom LICHESS_API_TOKEN.
          if [ -n "${LICHESS_API_TOKEN:-}" ]; then
            printf '%s' "$LICHESS_API_TOKEN" > package/CoachEchecs/lichess_token.txt
            echo "Token Lichess inclus dans le package."
          else
            echo "Pas de secret LICHESS_API_TOKEN configuré -- package sans repli Lichess (livre local + base ECO locale uniquement)."
          fi
          # lc0 (profil "classical", voir web_bridge.py) : binaire + poids +
          # DLL commités dans le dépôt (engines/lc0/, pas téléchargés à la
          # volée comme Stockfish/Berserk ci-dessus) -- copié en préservant
          # le même chemin relatif "engines/lc0/..." qu'en dev
          # (app_paths.get_base_dir() pointe sur le dossier de l'exe une
          # fois compilé), pour que resolve_lc0_path (main.py) trouve les
          # fichiers sans code différent entre dev et .exe packagé.
          # Optionnel : absent -> "classical" retombe sur Stockfish/Berserk
          # (voir _start_lc0_engine).
          if [ -d engines/lc0 ]; then
            cp -r engines package/CoachEchecs/
            echo "lc0 inclus dans le package."
          else
            echo "Pas de engines/lc0/ trouvé -- package sans lc0 (\"classical\" utilisera Stockfish/Berserk)."
          fi
          cd package
          7z a -r CoachEchecs-windows.zip CoachEchecs
        env:
          LICHESS_API_TOKEN: ${{ secrets.LICHESS_API_TOKEN }}

      - name: Publier la Release avec le zip
        uses: softprops/action-gh-release@v2
        with:
          files: package/CoachEchecs-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Garder aussi le zip comme artifact (pour les builds manuels sans tag)
        uses: actions/upload-artifact@v4
        with:
          name: CoachEchecs-windows
          path: package/CoachEchecs-windows.zip
